name: Build
on:
  - pull_request
  - push

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  EngageMacOsTest:
    needs: Lint
    name: ${{ matrix.os }} ${{ matrix.nodeVersion }} Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        nodeVersion: ["22.13.1", "24.14.1"]
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules
        run: npm rebuild keytar
      - name: Build CLI
        run: npm run build
      - name: Run tests
        run: npm run engagetest

  EngageWindowsTest:
    needs: Lint
    name: ${{ matrix.os }} ${{ matrix.nodeVersion }} Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        nodeVersion: ["22.13.1", "24.14.1"]
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules
        run: npm rebuild keytar
      - name: Build CLI
        run: npm run build
      - name: Run tests
        run: npm run engagetest

  EngageUbuntuTest:
    needs: Lint
    name: ${{ matrix.os }} ${{ matrix.nodeVersion }} Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        nodeVersion: ["22.13.1", "24.14.1"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: Install libsecret
        run: sudo apt-get install -y libsecret-1-0
      - name: Install dependencies
        run: npm ci
      - name: Rebuild native modules
        run: npm rebuild keytar
      - name: Build CLI
        run: npm run build
      - name: Run tests
        run: npm run engagetest
